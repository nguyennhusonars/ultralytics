# DEIMv2-Pico - HGNetv2 Pico (3-stage) backbone with lightweight 2-level DEIMv2 decoder
# Adapted from DEIMv2: https://github.com/ShihuaHuang95/DEIMv2
# Original: 1.5M params, 5.2 GFLOPs, 38.5 AP on COCO

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  pico: [1.00, 1.00, 512]

backbone:
  # HGNetv2 Pico backbone (3 stages only, stride up to 16)
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [16, 16]] # 0-P2/4
  - [-1, 3, HGBlock, [16, 64, 3]] # 1 stage 1

  - [-1, 1, DWConv, [64, 3, 2, 1, False]] # 2-P3/8
  - [-1, 3, HGBlock, [32, 256, 3]] # 3 stage 2

  - [-1, 1, DWConv, [256, 3, 2, 1, False]] # 4-P4/16
  - [-1, 3, HGBlock, [64, 512, 5, True, False]] # 5
  - [-1, 3, HGBlock, [64, 512, 5, True, True]] # 6 stage 3 (output: ch=512, stride 16)

head:
  # Lightweight 2-level neck (no AIFI, matching LiteEncoder spirit)
  - [-1, 1, Conv, [112, 1, 1, None, 1, 1, False]] # 7 input_proj → ch=112, stride 16
  - [-1, 1, Conv, [112, 3, 2]] # 8 downsample → ch=112, stride 32
  - [-1, 1, Conv, [112, 1, 1]] # 9 Y5

  # FPN: upsample stride-32, concat with stride-16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 7], 1, Concat, [1]] # 11 cat → ch=224
  - [-1, 1, RepC3, [112]] # 12 X4 (fpn_block, stride 16)

  # PAN: downsample stride-16, concat with stride-32
  - [-1, 1, Conv, [112, 3, 2]] # 13 downsample
  - [[-1, 9], 1, Concat, [1]] # 14 cat → ch=224
  - [-1, 1, RepC3, [112]] # 15 F5 (pan_block, stride 32)

  - [[12, 15], 1, DEIMv2Decoder, [nc, 112, 200, 3, 2, [4, 2], 32, 4, 4, 320, True, False]] # DEIMv2Decoder(P4, P5)
  # DEIMv2Decoder args: nc, hidden_dim, num_queries, num_decoder_layers, num_levels, num_points, reg_max, reg_scale, num_heads, d_ffn, share_bbox_head, use_gateway
