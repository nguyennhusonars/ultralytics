# DEIMv2-N (Nano) - HGNetv2 B0 backbone with 2-level DEIMv2 decoder
# Adapted from DEIMv2: https://github.com/ShihuaHuang95/DEIMv2

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [1.00, 1.00, 1024]

backbone:
  # HGNetv2 B0 backbone
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [16, 16]] # 0-P2/4
  - [-1, 3, HGBlock, [16, 64, 3]] # 1 stage 1

  - [-1, 1, DWConv, [64, 3, 2, 1, False]] # 2-P3/8
  - [-1, 3, HGBlock, [32, 256, 3]] # 3 stage 2

  - [-1, 1, DWConv, [256, 3, 2, 1, False]] # 4-P4/16
  - [-1, 3, HGBlock, [64, 512, 5, True, False]] # 5
  - [-1, 3, HGBlock, [64, 512, 5, True, True]] # 6 stage 3 (P4)

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 7-P5/32
  - [-1, 3, HGBlock, [128, 1024, 5, True, False]] # 8 stage 4 (P5)

head:
  # 2-level neck (P4, P5) with hidden_dim=128
  - [-1, 1, Conv, [128, 1, 1, None, 1, 1, False]] # 9 input_proj.1
  - [-1, 1, AIFI, [512, 8]] # 10
  - [-1, 1, Conv, [128, 1, 1]] # 11, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [6, 1, Conv, [128, 1, 1, None, 1, 1, False]] # 13 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 14
  - [-1, 3, RepC3, [128]] # 15, X4, fpn_blocks.0

  - [-1, 1, Conv, [128, 3, 2]] # 16, downsample_convs.0
  - [[-1, 11], 1, Concat, [1]] # 17 cat Y5
  - [-1, 3, RepC3, [128]] # 18, F5, pan_blocks.0

  - [[15, 18], 1, DEIMv2Decoder, [nc, 128, 300, 3, 2, [6, 6], 32, 4, 8, 512]] # DEIMv2Decoder(P4, P5)
  # DEIMv2Decoder args: nc, hidden_dim, num_queries, num_decoder_layers, num_levels, num_points, reg_max, reg_scale, num_heads, d_ffn
