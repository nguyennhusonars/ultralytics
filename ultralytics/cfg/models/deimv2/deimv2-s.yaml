# DEIMv2-S (Small) - HGNetv2 B0 backbone with DEIMv2 decoder
# Adapted from DEIMv2: https://github.com/ShihuaHuang95/DEIMv2

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  s: [1.00, 1.00, 1024]

backbone:
  # HGNetv2 B0 backbone
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [16, 16]] # 0-P2/4
  - [-1, 3, HGBlock, [16, 64, 3]] # stage 1

  - [-1, 1, DWConv, [64, 3, 2, 1, False]] # 2-P3/8
  - [-1, 3, HGBlock, [32, 256, 3]] # stage 2

  - [-1, 1, DWConv, [256, 3, 2, 1, False]] # 4-P4/16
  - [-1, 3, HGBlock, [64, 512, 5, True, False]]
  - [-1, 3, HGBlock, [64, 512, 5, True, True]] # stage 3

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 7-P5/32
  - [-1, 3, HGBlock, [128, 1024, 5, True, False]] # stage 4

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 9 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]] # 11, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 15, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 16, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 18 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, RepC3, [256]] # X3 (20), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 21, downsample_convs.0
  - [[-1, 16], 1, Concat, [1]] # cat Y4
  - [-1, 3, RepC3, [256]] # F4 (23), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 24, downsample_convs.1
  - [[-1, 11], 1, Concat, [1]] # cat Y5
  - [-1, 3, RepC3, [256]] # F5 (26), pan_blocks.1

  - [[20, 23, 26], 1, DEIMv2Decoder, [nc, 256, 300, 3, 3, [3, 6, 3], 32, 4, 8, 2048]] # DEIMv2Decoder(P3, P4, P5)
  # DEIMv2Decoder args: nc, hidden_dim, num_queries, num_decoder_layers, num_levels, num_points, reg_max, reg_scale, num_heads, d_ffn
