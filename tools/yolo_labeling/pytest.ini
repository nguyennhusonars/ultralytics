[pytest]
# This file exists so pytest picks THIS directory as rootdir instead of the repo
# root. The repo's pyproject.toml sets `--doctest-modules` and tests/conftest.py
# imports torch in pytest_sessionstart -- neither should apply here.
testpaths = tests
pythonpath = ..
addopts = -q --strict-markers -m "not gui"
markers =
    gui: requires a display; run with `xvfb-run -a pytest -m gui`
    legacy: runs against the pre-refactor monolith
